_format_version: "3.0"
_transform: true

services:
  - name: ai-agent-service
    url: http://host.docker.internal:8005
    routes:
      - name: ai-agent-route
        paths:
          - /ai-agent
        strip_path: true

plugins:
  - name: rate-limiting
    config:
      minute: 5
      policy: local